spring.application.name=JobsMVP
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=Test1234

# --- LangChain4j
langchain4j.google-ai-gemini.api-key=${GEMINI_API_KEY}
langchain4j.google-ai-gemini.chat-model.model-name=gemini-3.1-flash-lite-preview
#langchain4j.google-ai-gemini.chat-model.model-name=gemini-1.5-flash
langchain4j.google-ai-gemini.chat-model.temperature=0.0
langchain4j.google-ai-gemini.embedding-model.model-name=gemini-embedding-001

langchain4j.ollama.base-url=http://localhost:11434
langchain4j.ollama.embedding-model.model-name=qwen3-embedding:8b

# --- JSearch RapidAPI
#jsearch.api-key=${JSEARCH_API_KEY}
#jsearch.query=developer
#jsearch.pages=1

# --- Job Sources
ingestion.sources.jsearch.enabled=true
ingestion.sources.jsearch.api-key=${JSEARCH_API_KEY}
ingestion.sources.jsearch.default-query=junior developer jobs
ingestion.sources.jsearch.pages=1

ingestion.sources.adzuna.enabled=false
ingestion.sources.adzuna.app-id=${ADZUNA_APP_ID:}
ingestion.sources.adzuna.api-key=${ADZUNA_API_KEY:}
ingestion.sources.adzuna.country=gb
ingestion.sources.adzuna.default-query=software engineer
ingestion.sources.adzuna.pages=2

ingestion.sources.json-file.enabled=false


# --- Ingestion pipeline
ingestion.raw-data-path=raw-data
# Runs daily at 02:00. Set to "-" to disable scheduled runs.
ingestion.cron=-

ingestion.students.file-path=src/main/resources/student-data/students.json


# --- Logging
logging.level.com.example.jobsmvp=INFO
logging.level.com.example.jobsmvp.ingestion=DEBUG
logging.level.org.springframework.data.neo4j=WARN
logging.level.org.neo4j.driver=WARN

spring.profiles.active=dev